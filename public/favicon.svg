<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#070e2d" />
      <stop offset="70%" stop-color="#03071e" />
      <stop offset="100%" stop-color="#01030e" />
    </radialGradient>

    <!-- Metallic Gold Primary Gradient -->
    <linearGradient id="gold-primary" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#C59345" />
      <stop offset="18%" stop-color="#E8C373" />
      <stop offset="35%" stop-color="#FFF5C2" />
      <stop offset="55%" stop-color="#D7A454" />
      <stop offset="78%" stop-color="#8F5E24" />
      <stop offset="100%" stop-color="#E9BC58" />
    </linearGradient>

    <!-- Metallic Gold Highlight Gradient -->
    <linearGradient id="gold-highlight" x1="85%" y1="15%" x2="15%" y2="85%">
      <stop offset="0%" stop-color="#F3CA68" />
      <stop offset="35%" stop-color="#FFFBE0" />
      <stop offset="65%" stop-color="#D4A04F" />
      <stop offset="100%" stop-color="#996826" />
    </linearGradient>

    <!-- Shadow for Depth -->
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#d4a04f" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bg-grad)" />

  <!-- Outer Emblem Group with Shadow -->
  <g filter="url(#gold-glow)">
    <!-- The Golden "O" Ring with custom bevel curvature -->
    <path
      d="M 256 90 
         C 162 90, 95 158, 95 252 
         C 95 316, 126 364, 172 390 
         C 160 376, 150 354, 146 332 
         C 142 308, 144 246, 152 220 
         C 168 168, 206 138, 256 138 
         C 306 138, 344 168, 360 220 
         C 368 246, 370 308, 366 332 
         C 362 354, 352 376, 340 390 
         C 386 364, 417 316, 417 252 
         C 417 158, 350 90, 256 90 Z"
      fill="url(#gold-primary)"
    />

    <!-- Inner specular edge highlight for 3D luxury feel -->
    <path
      d="M 256 90 
         C 300 90, 352 115, 385 158 
         C 410 190, 417 228, 417 252 
         C 417 285, 404 322, 380 352 
         C 368 340, 362 320, 360 290 
         C 356 220, 320 148, 256 142 
         C 256 120, 256 100, 256 90 Z"
      fill="url(#gold-highlight)"
      opacity="0.5"
    />

    <!-- Upper Wave Ribbon (Oasis Ripple 1) -->
    <path
      d="M 112 375 
         C 175 348, 235 348, 280 372 
         C 335 402, 385 398, 420 366 
         C 395 408, 335 422, 280 394 
         C 230 368, 175 372, 112 375 Z"
      fill="url(#gold-highlight)"
    />

    <!-- Lower Wave Ribbon (Oasis Ripple 2) -->
    <path
      d="M 85 418 
         C 155 394, 220 396, 268 420 
         C 325 448, 378 442, 418 412 
         C 390 452, 330 468, 268 438 
         C 215 412, 150 416, 85 418 Z"
      fill="url(#gold-primary)"
    />
  </g>
</svg>
